openapi: "3.1.0"
info:
  title: "TW Minesweeper Server API"
  version: "1.0.0"
  description: "HTTP and server-sent event API implemented by the Minesweeper server."
tags:
  -
    name: "Games"
    description: "Game and matchmaking operations."
  -
    name: "Rankings"
    description: "Player rankings and scores."
  -
    name: "Users"
    description: "User registration and authentication."
servers:
  -
    url: "/"
paths:
  "/register":
    post:
      operationId: "register"
      summary: "Register a user or log in an existing user"
      description: "Creates a user when the name is new. For an existing user, validates the password."
      tags:
        - "Users"
      requestBody:
        required: true
        description: "User name and password."
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
            examples:
              existingUser:
                summary: "Log in as the CI test player"
                value:
                  name: "schemathesis-player"
                  pass: "schemathesis-password"
      responses:
        "200":
          description: "Registration or login result"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Result"
              examples:
                success:
                  value: {}
                failure:
                  value:
                    error: "Utilizador registado com senha diferente"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
  "/ranking":
    post:
      operationId: "getRanking"
      summary: "Get the top ten rankings for a level"
      description: "Returns the top ten rankings for the requested difficulty level."
      tags:
        - "Rankings"
      requestBody:
        required: true
        description: "Difficulty level for which to retrieve rankings."
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RankingRequest"
            examples:
              beginner:
                summary: "Get beginner rankings"
                value:
                  level: "beginner"
      responses:
        "200":
          description: "Rankings ordered by score and timestamp"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "ranking"
                properties:
                  ranking:
                    type: "array"
                    maxItems: 10
                    items:
                      "$ref": "#/components/schemas/Ranking"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
  "/join":
    post:
      operationId: "joinGame"
      summary: "Join the waiting queue for a game"
      description: "Returns a game identifier and player key when the credentials are valid."
      tags:
        - "Games"
      requestBody:
        required: true
        description: "User credentials and desired game settings."
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/JoinRequest"
            examples:
              waitingPlayer:
                summary: "Join the queue as the CI test player"
                value:
                  name: "schemathesis-player"
                  pass: "schemathesis-password"
                  group: 0
                  level: "beginner"
      responses:
        "200":
          description: "Game and player credentials"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "key"
                  - "game"
                properties:
                  key:
                    type: "string"
                  game:
                    type: "integer"
                    minimum: 0
        "400":
          "$ref": "#/components/responses/BadRequest"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
  "/leave":
    post:
      operationId: "leaveQueue"
      summary: "Leave the waiting queue"
      description: "Removes a player from the waiting queue when the game credentials are valid."
      tags:
        - "Games"
      requestBody:
        required: true
        description: "Game identifier and player credentials."
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PlayerCredentials"
            examples:
              unknownPlayer:
                summary: "Credentials for a player who is not in a game"
                value:
                  game: 0
                  name: "unknown-player"
                  key: "unknown-key"
      responses:
        "200":
          description: "Request accepted"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EmptyResult"
        "400":
          "$ref": "#/components/responses/BadRequest"
  "/score":
    post:
      operationId: "getScore"
      summary: "Get a player's score for a level"
      description: "Returns the player score for the requested difficulty level."
      tags:
        - "Rankings"
      requestBody:
        required: true
        description: "Player name and difficulty level."
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ScoreRequest"
            examples:
              beginner:
                summary: "Get beginner score for the CI test player"
                value:
                  name: "schemathesis-player"
                  level: "beginner"
      responses:
        "200":
          description: "Player score or an application-level error"
          content:
            "application/json":
              schema:
                oneOf:
                  -
                    type: "object"
                    required:
                      - "score"
                    properties:
                      score:
                        type: "integer"
                        minimum: 0
                  -
                    "$ref": "#/components/schemas/ErrorResult"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
  "/notify":
    post:
      operationId: "notifyMove"
      summary: "Submit a move in a game"
      description: "Submits a one-based row and column position for the current game."
      tags:
        - "Games"
      requestBody:
        required: true
        description: "Game credentials and the row and column of the move."
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/NotifyRequest"
            examples:
              invalidPlayer:
                summary: "Submit a move with unknown player credentials"
                value:
                  game: 0
                  name: "unknown-player"
                  key: "unknown-key"
                  row: 1
                  col: 1
      responses:
        "200":
          description: "Move accepted, or an application-level error"
          content:
            "application/json":
              schema:
                oneOf:
                  -
                    "$ref": "#/components/schemas/EmptyResult"
                  -
                    "$ref": "#/components/schemas/ErrorResult"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
  "/update":
    get:
      operationId: "subscribeToGame"
      summary: "Subscribe to game updates"
      description: "Streams JSON game-start, move, and end events via SSE; invalid credentials return a JSON error with HTTP 200."
      tags:
        - "Games"
      parameters:
        -
          name: "game"
          in: "query"
          required: true
          description: "Game identifier."
          example: "0"
          schema:
            type: "string"
            minLength: 1
        -
          name: "name"
          in: "query"
          required: true
          description: "Player name."
          example: "unknown-player"
          schema:
            type: "string"
            minLength: 1
        -
          name: "key"
          in: "query"
          required: true
          description: "Player key."
          example: "unknown-key"
          schema:
            type: "string"
            minLength: 1
      responses:
        "200":
          description: "Server-sent game events, or a JSON application-level error"
          content:
            "text/event-stream":
              schema:
                type: "string"
                description: "Stream of data events whose JSON payload is one of GameStartEvent, MoveEvent, or GameEndEvent."
              examples:
                start:
                  value: "data: {\"opponent\":\"player2\",\"turn\":\"player1\"}\n\n"
                move:
                  value: "data: {\"move\":{\"name\":\"player1\",\"cells\":[[1,1,0]]},\"turn\":\"player2\"}\n\n"
                end:
                  value: "data: {\"move\":{\"name\":\"player1\",\"cells\":[[1,1,-1]]},\"winner\":\"player1\"}\n\n"
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResult"
        "400":
          "$ref": "#/components/responses/BadRequest"
components:
  responses:
    BadRequest:
      description: "Request data failed validation"
      content:
        "application/json":
          schema:
            type: "object"
            description: "Zod validation error"
            additionalProperties: true
    TooManyRequests:
      description: "Rate limit exceeded"
      content:
        "application/json":
          schema:
            type: "object"
            required:
              - "message"
            properties:
              message:
                type: "string"
                example: "Too many requests, please try again later."
  schemas:
    RegisterRequest:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
        pass:
          type: "string"
      required:
        - "name"
        - "pass"
      description: "User name and password used to register or log in."
    RankingRequest:
      type: "object"
      properties:
        level:
          type: "string"
          minLength: 1
      required:
        - "level"
      description: "Request for rankings at a difficulty level."
    JoinRequest:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
        pass:
          type: "string"
        group:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        level:
          type: "string"
          minLength: 1
      required:
        - "name"
        - "pass"
        - "group"
        - "level"
      description: "User credentials and game settings used to join matchmaking."
    PlayerCredentials:
      type: "object"
      properties:
        game:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        name:
          type: "string"
          minLength: 1
        key:
          type: "string"
          minLength: 1
      required:
        - "game"
        - "name"
        - "key"
      description: "Credentials identifying a player in a game."
    ScoreRequest:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
        level:
          type: "string"
          minLength: 1
      required:
        - "name"
        - "level"
      description: "Player name and difficulty level for a score lookup."
    NotifyRequest:
      type: "object"
      properties:
        game:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        name:
          type: "string"
          minLength: 1
        key:
          type: "string"
          minLength: 1
        row:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        col:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
      required:
        - "game"
        - "name"
        - "key"
        - "row"
        - "col"
      description: "Player credentials and board position for a move."
    UpdateRequest:
      type: "object"
      properties:
        game:
          type: "string"
          minLength: 1
        name:
          type: "string"
          minLength: 1
        key:
          type: "string"
          minLength: 1
      required:
        - "game"
        - "name"
        - "key"
      description: "Query parameters identifying a player and game update stream."
    EmptyResult:
      type: "object"
      additionalProperties: false
      description: "Empty JSON object returned when an operation succeeds without additional data."
    Result:
      oneOf:
        -
          "$ref": "#/components/schemas/EmptyResult"
        -
          "$ref": "#/components/schemas/ErrorResult"
      description: "Successful empty result or an application-level error."
    ErrorResult:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "string"
      description: "Application-level error message."
    Ranking:
      type: "object"
      required:
        - "name"
        - "level"
        - "score"
        - "timestamp"
      properties:
        name:
          type: "string"
        level:
          type: "string"
          enum:
            - "beginner"
            - "intermediate"
            - "expert"
        score:
          type: "integer"
        timestamp:
          type: "integer"
          format: "int64"
      description: "A player score and its ranking level and timestamp."
    GameStartEvent:
      type: "object"
      required:
        - "opponent"
        - "turn"
      properties:
        opponent:
          type: "string"
        turn:
          type: "string"
      description: "JSON payload sent when a game starts."
    MoveEvent:
      type: "object"
      required:
        - "move"
        - "turn"
      properties:
        move:
          "$ref": "#/components/schemas/Move"
        turn:
          type: "string"
      description: "JSON payload sent when a player makes a move."
    GameEndEvent:
      type: "object"
      required:
        - "move"
        - "winner"
      properties:
        move:
          "$ref": "#/components/schemas/Move"
        winner:
          type: "string"
      description: "JSON payload sent when a game ends."
    Move:
      type: "object"
      required:
        - "name"
        - "cells"
      properties:
        name:
          type: "string"
        cells:
          type: "array"
          items:
            type: "array"
            items:
              type: "integer"
              minimum: -1
        winner:
          type: "string"
      description: "A player move and the affected board cells."
