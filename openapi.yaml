openapi: "3.1.0"
info:
  title: "TW Minesweeper Server API"
  version: "1.0.0"
  description: "HTTP and server-sent event API implemented by the Minesweeper server."
servers:
  -
    url: "/"
paths:
  "/register":
    post:
      operationId: "register"
      summary: "Register a user or log in an existing user"
      description: "Creates a user when the name is new. For an existing user, validates the password. Application-level errors are returned as JSON with HTTP 200; malformed request bodies return HTTP 400."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: "Registration or login result"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Result"
              examples:
                success:
                  value: {}
                failure:
                  value:
                    error: "Utilizador registado com senha diferente"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
  "/ranking":
    post:
      operationId: "getRanking"
      summary: "Get the top ten rankings for a level"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RankingRequest"
      responses:
        "200":
          description: "Rankings ordered by score and timestamp"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "ranking"
                properties:
                  ranking:
                    type: "array"
                    maxItems: 10
                    items:
                      "$ref": "#/components/schemas/Ranking"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
  "/join":
    post:
      operationId: "joinGame"
      summary: "Join the waiting queue for a game"
      description: "Returns a game identifier and player key when the credentials are valid."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/JoinRequest"
      responses:
        "200":
          description: "Game and player credentials"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "key"
                  - "game"
                properties:
                  key:
                    type: "string"
                  game:
                    type: "integer"
                    minimum: 0
        "400":
          "$ref": "#/components/responses/BadRequest"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
  "/leave":
    post:
      operationId: "leaveQueue"
      summary: "Leave the waiting queue"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PlayerCredentials"
      responses:
        "200":
          description: "Request accepted"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EmptyResult"
        "400":
          "$ref": "#/components/responses/BadRequest"
  "/score":
    post:
      operationId: "getScore"
      summary: "Get a player's score for a level"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ScoreRequest"
      responses:
        "200":
          description: "Player score or an application-level error"
          content:
            "application/json":
              schema:
                oneOf:
                  -
                    type: "object"
                    required:
                      - "score"
                    properties:
                      score:
                        type: "integer"
                        minimum: 0
                  -
                    "$ref": "#/components/schemas/ErrorResult"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
  "/notify":
    post:
      operationId: "notifyMove"
      summary: "Submit a move in a game"
      description: "Coordinates are one-based row and column positions."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/NotifyRequest"
      responses:
        "200":
          description: "Move accepted, or an application-level error"
          content:
            "application/json":
              schema:
                oneOf:
                  -
                    "$ref": "#/components/schemas/EmptyResult"
                  -
                    "$ref": "#/components/schemas/ErrorResult"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "429":
          "$ref": "#/components/responses/TooManyRequests"
  "/update":
    get:
      operationId: "subscribeToGame"
      summary: "Subscribe to game updates"
      description: "Opens a server-sent events connection. Events are sent as data lines containing JSON for a game start, move, or end. Invalid credentials produce an application-level JSON error with HTTP 200 instead of an event stream."
      parameters:
        -
          name: "game"
          in: "query"
          required: true
          schema:
            type: "string"
            minLength: 1
        -
          name: "name"
          in: "query"
          required: true
          schema:
            type: "string"
            minLength: 1
        -
          name: "key"
          in: "query"
          required: true
          schema:
            type: "string"
            minLength: 1
      responses:
        "200":
          description: "Server-sent game events, or a JSON application-level error"
          content:
            "text/event-stream":
              schema:
                type: "string"
                description: "Stream of data events whose JSON payload is one of GameStartEvent, MoveEvent, or GameEndEvent."
                examples:
                  start:
                    value: "data: {\"opponent\":\"player2\",\"turn\":\"player1\"}\n\n"
                  move:
                    value: "data: {\"move\":{\"name\":\"player1\",\"cells\":[[1,1,0]]},\"turn\":\"player2\"}\n\n"
                  end:
                    value: "data: {\"move\":{\"name\":\"player1\",\"cells\":[[1,1,-1]]},\"winner\":\"player1\"}\n\n"
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResult"
        "400":
          "$ref": "#/components/responses/BadRequest"
components:
  responses:
    BadRequest:
      description: "Request data failed validation"
      content:
        "application/json":
          schema:
            type: "object"
            description: "Zod validation error"
            additionalProperties: true
    TooManyRequests:
      description: "Rate limit exceeded"
      content:
        "application/json":
          schema:
            type: "object"
            required:
              - "message"
            properties:
              message:
                type: "string"
                example: "Too many requests, please try again later."
  schemas:
    RegisterRequest:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
        pass:
          type: "string"
      required:
        - "name"
        - "pass"
    RankingRequest:
      type: "object"
      properties:
        level:
          type: "string"
          minLength: 1
      required:
        - "level"
    JoinRequest:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
        pass:
          type: "string"
        group:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        level:
          type: "string"
          minLength: 1
      required:
        - "name"
        - "pass"
        - "group"
        - "level"
    PlayerCredentials:
      type: "object"
      properties:
        game:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        name:
          type: "string"
          minLength: 1
        key:
          type: "string"
          minLength: 1
      required:
        - "game"
        - "name"
        - "key"
    ScoreRequest:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
        level:
          type: "string"
          minLength: 1
      required:
        - "name"
        - "level"
    NotifyRequest:
      type: "object"
      properties:
        game:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        name:
          type: "string"
          minLength: 1
        key:
          type: "string"
          minLength: 1
        row:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        col:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
      required:
        - "game"
        - "name"
        - "key"
        - "row"
        - "col"
    UpdateRequest:
      type: "object"
      properties:
        game:
          type: "string"
          minLength: 1
        name:
          type: "string"
          minLength: 1
        key:
          type: "string"
          minLength: 1
      required:
        - "game"
        - "name"
        - "key"
    EmptyResult:
      type: "object"
      additionalProperties: false
    Result:
      oneOf:
        -
          "$ref": "#/components/schemas/EmptyResult"
        -
          "$ref": "#/components/schemas/ErrorResult"
    ErrorResult:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "string"
    Ranking:
      type: "object"
      required:
        - "name"
        - "level"
        - "score"
        - "timestamp"
      properties:
        name:
          type: "string"
        level:
          type: "string"
          enum:
            - "beginner"
            - "intermediate"
            - "expert"
        score:
          type: "integer"
        timestamp:
          type: "integer"
          format: "int64"
    GameStartEvent:
      type: "object"
      required:
        - "opponent"
        - "turn"
      properties:
        opponent:
          type: "string"
        turn:
          type: "string"
    MoveEvent:
      type: "object"
      required:
        - "move"
        - "turn"
      properties:
        move:
          "$ref": "#/components/schemas/Move"
        turn:
          type: "string"
    GameEndEvent:
      type: "object"
      required:
        - "move"
        - "winner"
      properties:
        move:
          "$ref": "#/components/schemas/Move"
        winner:
          type: "string"
    Move:
      type: "object"
      required:
        - "name"
        - "cells"
      properties:
        name:
          type: "string"
        cells:
          type: "array"
          items:
            type: "array"
            items:
              type: "integer"
              minimum: -1
        winner:
          type: "string"
