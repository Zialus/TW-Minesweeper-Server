name: Build

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        name: Build and Test
        runs-on: 'ubuntu-26.04'
        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

            - name: Start PostgreSQL with Docker Compose
              run: docker compose up --detach --wait postgres

            - name: 🟢 Setup Node.js 26
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
              with:
                  node-version: 26

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
              with:
                  cache: true

            - name: 📦 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate OpenAPI spec
              run: pnpm run openapi:generate

            - name: Verify generated OpenAPI spec
              run: |
                  if [ -n "$(git status --porcelain -- openapi.yaml)" ]; then
                    echo "openapi.yaml is out of date; regenerate it and commit the result."
                    git diff -- openapi.yaml
                    exit 1
                  fi

            - name: Lint OpenAPI spec
              run: pnpm run openapi:lint

            - name: 🏗️ Run build
              run: pnpm run build

            - name: 🧪 Run tests
              run: pnpm test

            - name: Start API for Schemathesis
              env:
                  PGHOST: 127.0.0.1
                  PGPORT: 5432
                  PGDATABASE: minesweeper
                  PGUSER: minesweeper
                  PGPASSWORD: ci-password
                  PORT: 9876
              run: |
                  set -euo pipefail
                  server_log="$RUNNER_TEMP/minesweeper-api.log"
                  server_pid_file="$RUNNER_TEMP/minesweeper-api.pid"
                  nohup env \
                    PGHOST="$PGHOST" \
                    PGPORT="$PGPORT" \
                    PGDATABASE="$PGDATABASE" \
                    PGUSER="$PGUSER" \
                    PGPASSWORD="$PGPASSWORD" \
                    PORT="$PORT" \
                    node dist/app.js >"$server_log" 2>&1 &
                  echo "$!" >"$server_pid_file"

                  for attempt in $(seq 1 30); do
                    if curl --silent --fail \
                      --header 'Content-Type: application/json' \
                      --data '{"level":"beginner"}' \
                      http://127.0.0.1:9876/ranking >/dev/null; then
                      break
                    fi
                    if ! kill -0 "$(cat "$server_pid_file")" 2>/dev/null; then
                      cat "$server_log"
                      exit 1
                    fi
                    sleep 1
                  done

                  if ! curl --silent --fail \
                    --header 'Content-Type: application/json' \
                    --data '{"level":"beginner"}' \
                    http://127.0.0.1:9876/ranking >/dev/null; then
                    cat "$server_log"
                    echo "The API did not become ready."
                    exit 1
                  fi

            - name: Test live API with Schemathesis
              uses: schemathesis/action@806cace2053cbbac93188e1281ff7da415643160  # v3.0.0
              with:
                  schema: openapi.yaml
                  base-url: http://127.0.0.1:9876
                  version: 4.29.4
                  max-examples: '1'
                  coverage: 'false'
                  args: >-
                      --exclude-operation-id joinGame
                      --exclude-operation-id leaveQueue
                      --exclude-checks unsupported_method
                      --mode positive
                      --generation-allow-x00 false
                      --generation-deterministic
                      --seed 20261007
                      --phases examples,coverage
                      --request-timeout 5
                      --rate-limit 100/m
                      --workers 1

            - name: 🧬 Run Stryker
              run: pnpm run test:mutate

            - name: 📊 Upload Stryker report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  archive: false
                  path: dist/stryker/mutation.html
                  if-no-files-found: warn
                  retention-days: 14

            - name: 📊 Upload coverage report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
              with:
                  name: coverage-report
                  path: dist/coverage
                  if-no-files-found: warn
                  retention-days: 14

            - name: 🔍 Run lint
              run: pnpm run lint

            - name: Stop API
              if: always()
              run: |
                  if [ -f "$RUNNER_TEMP/minesweeper-api.pid" ]; then
                    kill "$(cat "$RUNNER_TEMP/minesweeper-api.pid")" 2>/dev/null || true
                  fi
                  if [ -f "$RUNNER_TEMP/minesweeper-api.log" ]; then
                    tail -n 100 "$RUNNER_TEMP/minesweeper-api.log"
                  fi
              continue-on-error: true

            - name: Stop PostgreSQL with Docker Compose
              if: always()
              run: docker compose down --volumes --remove-orphans
              continue-on-error: true
