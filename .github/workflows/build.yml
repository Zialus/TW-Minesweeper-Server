name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: minesweeper
          POSTGRES_USER: minesweeper
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minesweeper -d minesweeper"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24.16.0

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: true

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build and generate OpenAPI spec
      run: pnpm run openapi:generate

    - name: Verify generated OpenAPI spec
      run: |
        if [ -n "$(git status --porcelain -- openapi.yaml)" ]; then
          echo "openapi.yaml is out of date; regenerate it and commit the result."
          git diff -- openapi.yaml
          exit 1
        fi

    - name: Lint OpenAPI spec
      run: pnpm run openapi:lint

    - name: Initialize integration database
      env:
        PGHOST: 127.0.0.1
        PGPORT: 5432
        PGDATABASE: minesweeper
        PGUSER: minesweeper
        PGPASSWORD: ci-password
      run: |
        node <<'NODE'
        const { readFileSync } = require('node:fs');
        const { Pool } = require('pg');

        const pool = new Pool();
        (async () => {
          try {
            await pool.query(readFileSync('DB/minesweeperDB.sql', 'utf8'));
          } finally {
            await pool.end();
          }
        })().catch((error) => {
          console.error(error);
          process.exitCode = 1;
        });
        NODE

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'

    - name: Install Schemathesis
      run: python -m pip install --disable-pip-version-check schemathesis==4.29.4

    - name: Test live API with Schemathesis
      env:
        PGHOST: 127.0.0.1
        PGPORT: 5432
        PGDATABASE: minesweeper
        PGUSER: minesweeper
        PGPASSWORD: ci-password
        PORT: 9876
      run: |
        set -euo pipefail
        server_log="$(mktemp)"
        node dist/app.js >"$server_log" 2>&1 &
        server_pid=$!
        cleanup() {
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          rm -f "$server_log"
        }
        trap cleanup EXIT

        for attempt in $(seq 1 30); do
          if curl --silent --fail \
            --header 'Content-Type: application/json' \
            --data '{"level":"beginner"}' \
            http://127.0.0.1:9876/ranking >/dev/null; then
            break
          fi
          if ! kill -0 "$server_pid" 2>/dev/null; then
            cat "$server_log"
            exit 1
          fi
          sleep 1
        done

        if ! curl --silent --fail \
          --header 'Content-Type: application/json' \
          --data '{"level":"beginner"}' \
          http://127.0.0.1:9876/ranking >/dev/null; then
          cat "$server_log"
          echo "The API did not become ready."
          exit 1
        fi

        # Exclude matchmaking routes that wait for a second authenticated player.
        st run openapi.yaml \
          --url http://127.0.0.1:9876 \
          --exclude-operation-id joinGame \
          --exclude-operation-id leaveQueue \
          --exclude-checks unsupported_method \
          --mode positive \
          --generation-allow-x00 false \
          --generation-deterministic \
          --seed 20261007 \
          --phases examples,coverage \
          --max-examples 1 \
          --request-timeout 5 \
          --rate-limit 100/m \
          --workers 1

    - name: Run lint
      run: pnpm run lint
      continue-on-error: true # to be fixed later
