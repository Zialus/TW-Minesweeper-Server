name: CodSpeed Benchmarks

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    # Allows CodSpeed to trigger backtest performance analysis to generate initial data.
    workflow_dispatch:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    benchmarks:
        name: Run benchmarks
        runs-on: 'ubuntu-26.04'
        permissions:
            contents: read  # Needed to clone the repo.
            id-token: write  # Needed for OpenID Connect authentication with CodSpeed.

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false

            - name: 🟢 Setup Node.js 26
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
              with:
                  node-version: 26

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
              with:
                  cache: true

            - name: 📦 Install dependencies
              run: pnpm install --ignore-scripts --frozen-lockfile

            - name: ⏱️ Run benchmarks
              uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da  # v5.5.0
              with:
                  mode: simulation
                  run: pnpm run bench
