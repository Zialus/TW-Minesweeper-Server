name: GHAS Analysis with zizmor

on:
    push:
        branches: ['master']
    pull_request:
        branches: ['master']
    workflow_dispatch:

permissions: {}

jobs:
    zizmor:
        name: Run zizmor
        runs-on: 'ubuntu-26.04'
        permissions:
            security-events: write  # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
            contents: read  # Only needed for private repos. Needed to clone the repo.
            actions: read  # Only needed for private repos. Needed for upload-sarif to read workflow run info.
        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false

            - name: 🧹 Run yamllint
              uses: reviewdog/action-yamllint@5dd4640db975e4cac6f4e775a401695bafc28068  # v1.25.1

            - name: 🔍 Run actionlint
              uses: reviewdog/action-actionlint@1758727be30241166609dad4c97588b6ad411f32  # v1.79.1

            - name: 🛡️ Run zizmor (pedantic)
              uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
              with:
                  persona: pedantic
