name: GitHub Actions Lint and Security Analysis

on:
    push:
        branches: ['master']
    pull_request:
        branches: ['master']
    workflow_dispatch:

permissions: {}

jobs:
    zizmor:
        name: Lint and Security Analysis
        runs-on: 'ubuntu-26.04'
        permissions:
            security-events: write  # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
            contents: read  # Only needed for private repos. Needed to clone the repo.
            actions: read  # Only needed for private repos. Needed for upload-sarif to read workflow run info.
        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false

            - name: 🧹 Run yamllint
              uses: reviewdog/action-yamllint@3224b47de22a2fd9c8c0fbc120e6d0049d1f5060  # v1.25.2

            - name: 🔍 Run actionlint
              uses: reviewdog/action-actionlint@3cbf14efd750961dba35fccbf00f9e14028cb1f5  # v1.80.2

            - name: 🛡️ Run zizmor (pedantic)
              uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
              with:
                  persona: pedantic
