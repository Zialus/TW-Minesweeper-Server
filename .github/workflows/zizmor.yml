name: GitHub Actions Lint and Security Analysis

on:
    push:
        branches: ['master']
    pull_request:
        branches: ['master']
    workflow_dispatch:

permissions: {}

jobs:
    zizmor:
        name: Lint and Security Analysis
        runs-on: 'ubuntu-26.04'
        permissions:
            security-events: write  # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
            contents: read  # Only needed for private repos. Needed to clone the repo.
            actions: read  # Only needed for private repos. Needed for upload-sarif to read workflow run info.
        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
              with:
                  persist-credentials: false

            - name: 🧹 Run yamllint
              uses: reviewdog/action-yamllint@020fba38ce9fed550c704d933aeeb7d6360f7d47  # v1.26.0

            - name: 🔍 Run actionlint
              uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4  # v1.84.1

            - name: 🛡️ Run zizmor (pedantic)
              uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd  # v0.8.1
              with:
                  persona: pedantic
